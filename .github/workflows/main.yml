name: Update AdGuard Filters

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adguard-filters-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build massdns
        run: |
          sudo apt-get install -y --no-install-recommends build-essential
          git clone --depth 1 https://github.com/blechschmidt/massdns /tmp/massdns
          make -C /tmp/massdns -j$(nproc)
          sudo mv /tmp/massdns/bin/massdns /usr/local/bin/massdns

      - name: Run
        run: |
          BLOCK_OUT="blocklists.txt"
          WHITE_OUT="whitelist.txt"
          RESOLVERS_FILE="resolvers.tmp"
          DL_DIR="dl"

          VERSION="$(date -u +%Y.%m.%d.%H%M)"
          LAST_MODIFIED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          printf '%s\n' 8.8.8.8 8.8.4.4 > "$RESOLVERS_FILE"
          mkdir -p "$DL_DIR"

          normalize() {
            awk -v keep_exceptions="$1" '
              {
                line = tolower($0)
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", line)
                if (line == "" || line ~ /^[!#;\[]/) next
                if (line ~ /^@@/) { if (keep_exceptions != 1) next }
                sub(/^@@/, "", line)
                sub(/^\|\|?/, "", line)
                sub(/\^.*/, "", line);     sub(/[#!].*/, "", line)
                sub(/\/.*/, "", line);     sub(/:.*/, "", line)
                sub(/^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+[[:space:]]+/, "", line)
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", line)
                if (line ~ /^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+$/ && !seen[line]++) print line
              }'
          }

          write_list() {
            local out="$1" title="$2" desc="$3" body="$4" md5="$5"
            
            # Check phụ: Nếu MD5 gốc đổi nhưng sau khi qua massdns kết quả không đổi (hiếm)
            if [[ -f "$out" ]]; then
              grep -v -e '^!' -e '^\[Adblock' "$out" > "tmp_compare.txt" 2>/dev/null || true
              if diff -q "tmp_compare.txt" "$body" > /dev/null; then
                echo "$out: Kết quả sau massdns không đổi, giữ nguyên"
                rm -f "tmp_compare.txt"
                return
              fi
              rm -f "tmp_compare.txt"
            fi

            {
              echo "[Adblock Plus 2.0]"
              echo "! Title: $title"
              echo "! Version: $VERSION"
              echo "! Last modified: $LAST_MODIFIED"
              echo "! Expires: 12 hours (update frequency)"
              echo "! Source MD5: $md5"
              echo "! Description: $desc"
              echo "! GitHub: https://github.com/$GITHUB_REPOSITORY"
              echo "! Homepage: https://lists.bibica.net/$out"
              echo "!"
              cat "$body"
            } > "$out"
            echo "$out: đã cập nhật thành công."
          }

          check_and_write() {
            local in_file="$1"
            local out_file="$2"
            local title="$3"
            local desc="$4"
            local md5="$5"

            TOTAL=$(wc -l < "$in_file")
            echo "Total domains for $out_file: $TOTAL"
            if [[ "$TOTAL" -eq 0 ]]; then return; fi

            massdns -r "$RESOLVERS_FILE" -t A -o J -s 800 --retry SERVFAIL "$in_file" 2>/dev/null > "tmp_pass1.json"
            jq -r 'select(.status == "NOERROR") | .name | rtrimstr(".")' "tmp_pass1.json" > "tmp_valid.txt"
            jq -r 'select(.status == "SERVFAIL") | .name | rtrimstr(".")' "tmp_pass1.json" > "tmp_servfail.txt"
            
            SERVFAIL_COUNT=$(wc -l < "tmp_servfail.txt")
            if [[ "$SERVFAIL_COUNT" -gt 0 ]]; then
              massdns -r "$RESOLVERS_FILE" -t A -o J -s 200 --retry SERVFAIL "tmp_servfail.txt" 2>/dev/null \
              | jq -r 'select(.status == "NOERROR") | .name | rtrimstr(".")' >> "tmp_valid.txt"
            fi
            
            sort -u "tmp_valid.txt" | sed 's/.*/||&^/' > "tmp_body.txt"
            VALID_COUNT=$(wc -l < "tmp_body.txt")
            echo "Valid for $out_file: $VALID_COUNT / $TOTAL"
            
            write_list "$out_file" "$title" "$desc" "tmp_body.txt" "$md5"
            rm -f "tmp_pass1.json" "tmp_valid.txt" "tmp_servfail.txt" "tmp_body.txt"
          }

          process_remote_list() {
            local url="$1"
            local out_file="$2"
            local title="$3"
            
            echo "----------------------------------------"
            echo "Processing: $title"
            
            if curl -fsSL --max-time 120 "$url" -o "tmp_dl.txt"; then
               normalize 0 < "tmp_dl.txt" | sort -u > "tmp_norm.txt"
               
               CURRENT_MD5=$(md5sum "tmp_norm.txt" | awk '{print $1}')
               OLD_MD5=""
               if [[ -f "$out_file" ]]; then
                 OLD_MD5=$(grep -E '^! Source MD5: ' "$out_file" | awk '{print $4}' || true)
               fi
               
               if [[ -n "$CURRENT_MD5" && "$CURRENT_MD5" == "$OLD_MD5" ]]; then
                 echo "=> File gốc không thay đổi (MD5 trùng). Bỏ qua massdns."
                 rm -f "tmp_dl.txt" "tmp_norm.txt"
                 return
               fi

               check_and_write "tmp_norm.txt" "$out_file" "$title (Checked)" "Resolvable domains for $title, checked via massdns." "$CURRENT_MD5"
               rm -f "tmp_dl.txt" "tmp_norm.txt"
            else
               echo "Lỗi: Không thể tải $url"
            fi
          }

          # ==================== PHẦN 1: BỘ LỌC CŨ ====================
          echo "Downloading original sources..."
          curl -fsSL --max-time 90 --parallel --parallel-immediate \
            -o "$DL_DIR/block1.txt" https://adguardteam.github.io/HostlistsRegistry/assets/filter_16.txt \
            -o "$DL_DIR/block2.txt" https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt \
            -o "$DL_DIR/block3.txt" https://raw.githubusercontent.com/bibicadotnet/AdGuard-Home-blocklists/refs/heads/main/byme.txt \
            -o "$DL_DIR/block4.txt" https://badmojr.github.io/1Hosts/Lite/adblock.txt \
            -o "$DL_DIR/white1.txt" https://raw.githubusercontent.com/bibicadotnet/AdGuard-Home-blocklists/main/whitelist.txt \
            -o "$DL_DIR/white2.txt" https://raw.githubusercontent.com/ShadowWhisperer/BlockLists/master/Whitelists/Whitelist

          for f in "$DL_DIR"/*.txt; do
            [[ -s "$f" ]] || { echo "File rỗng hoặc tải lỗi: $f"; exit 1; }
          done

          # ---------------- WHITELIST GỐC ----------------
          cat "$DL_DIR"/white*.txt | normalize 1 | sort -u > "original_white_norm.txt"
          WHITE_MD5=$(md5sum "original_white_norm.txt" | awk '{print $1}')
          OLD_WHITE_MD5=""
          [[ -f "$WHITE_OUT" ]] && OLD_WHITE_MD5=$(grep -E '^! Source MD5: ' "$WHITE_OUT" | awk '{print $4}' || true)
          
          if [[ -n "$WHITE_MD5" && "$WHITE_MD5" == "$OLD_WHITE_MD5" ]]; then
            echo "=> Whitelist gộp không thay đổi. Bỏ qua."
          else
            sed 's/.*/@@||&^/' "original_white_norm.txt" > "whitelist_body.tmp"
            write_list "$WHITE_OUT" "Whitelist Minimal (AdGuard format)" "Whitelisted domains merged from multiple sources, converted to AdGuard syntax." "whitelist_body.tmp" "$WHITE_MD5"
            rm -f "whitelist_body.tmp"
          fi
          rm -f "original_white_norm.txt"

          # ---------------- BLOCKLIST GỐC ----------------
          cat "$DL_DIR"/block*.txt | normalize 0 | sort -u > "original_block_norm.txt"
          BLOCK_MD5=$(md5sum "original_block_norm.txt" | awk '{print $1}')
          OLD_BLOCK_MD5=""
          [[ -f "$BLOCK_OUT" ]] && OLD_BLOCK_MD5=$(grep -E '^! Source MD5: ' "$BLOCK_OUT" | awk '{print $4}' || true)

          if [[ -n "$BLOCK_MD5" && "$BLOCK_MD5" == "$OLD_BLOCK_MD5" ]]; then
            echo "=> Blocklist gộp không thay đổi. Bỏ qua massdns."
          else
            check_and_write "original_block_norm.txt" "$BLOCK_OUT" "Blocklist Minimal (AdGuard format)" "Resolvable domains merged from multiple blocklists, converted to AdGuard syntax." "$BLOCK_MD5"
          fi
          rm -f "original_block_norm.txt"

          # ==================== PHẦN 2: BỘ LỌC MỚI ====================
          process_remote_list "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/light.txt" "hagezi_light.txt" "HaGeZi Light"
          process_remote_list "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/multi.txt" "hagezi_multi.txt" "HaGeZi Multi NORMAL"
          process_remote_list "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/pro.txt" "hagezi_pro.txt" "HaGeZi Pro"
          process_remote_list "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/pro.plus.txt" "hagezi_pro_plus.txt" "HaGeZi Pro++"
          process_remote_list "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/ultimate.txt" "hagezi_ultimate.txt" "HaGeZi Ultimate"
          process_remote_list "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/tif.medium.txt" "hagezi_tif_medium.txt" "HaGeZi Threat Intelligence (Medium)"
          process_remote_list "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/nsfw.txt" "hagezi_nsfw.txt" "HaGeZi NSFW"
          process_remote_list "https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts" "stevenblack_unified.txt" "StevenBlack Unified Hosts"
          process_remote_list "https://big.oisd.nl" "oisd_big.txt" "OISD Big"
          process_remote_list "https://nsfw.oisd.nl" "oisd_nsfw.txt" "OISD NSFW"

          rm -rf "$DL_DIR" "$RESOLVERS_FILE"

      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update filters"
          file_pattern: '*.txt'
