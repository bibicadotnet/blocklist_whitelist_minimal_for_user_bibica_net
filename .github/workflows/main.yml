name: Update AdGuard Filters

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Cưỡng bức chạy lại tất cả bộ lọc (bỏ qua kiểm tra MD5, ghi lại header)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# Không hủy lượt đang chạy: nếu bị hủy giữa chừng thì không có gì được commit
concurrency:
  group: adguard-filters-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # massdns ít khi đổi -> cache binary, khỏi build lại mỗi lần
      - name: Cache massdns
        id: massdns-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/massdns
          key: massdns-${{ runner.os }}-v1

      - name: Build massdns
        if: steps.massdns-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y --no-install-recommends build-essential
          git clone --depth 1 https://github.com/blechschmidt/massdns /tmp/massdns
          make -C /tmp/massdns -j"$(nproc)"
          mkdir -p ~/.local/bin
          mv /tmp/massdns/bin/massdns ~/.local/bin/massdns

      - name: Add massdns to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Cache kết quả DNS (domain sống/chết + thời điểm kiểm tra). Mất cache chỉ làm chậm, không sai.
      - name: Cache DNS results
        uses: actions/cache@v4
        with:
          path: ~/.dnscache
          key: dnscache-${{ github.run_id }}
          restore-keys: |
            dnscache-

      - name: Update filters
        env:
          FORCE_UPDATE: ${{ inputs.force_update || false }}
        run: bash scripts/update-filters.sh

      - name: Commit
        if: ${{ !cancelled() }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update filters"
          file_pattern: '*.txt'
