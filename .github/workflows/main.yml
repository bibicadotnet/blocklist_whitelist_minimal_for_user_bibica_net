name: Update AdGuard Filters

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adguard-filters-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build massdns
        run: |
          sudo apt-get install -y --no-install-recommends build-essential
          git clone --depth 1 https://github.com/blechschmidt/massdns /tmp/massdns
          make -C /tmp/massdns -j$(nproc)
          sudo mv /tmp/massdns/bin/massdns /usr/local/bin/massdns

      - name: Run
        run: |
          BLOCK_OUT="blocklists.txt"
          WHITE_OUT="whitelist.txt"
          BLOCK_TMP="blocklists.tmp"
          BLOCK_BODY="blocklists.body.tmp"
          WHITE_BODY="whitelist.body.tmp"
          VALID_TMP="valid.tmp"
          RESOLVERS_FILE="resolvers.tmp"
          SERVFAIL_TMP="servfail.tmp"
          REFUSED_TMP="refused.tmp"
          PASS1_JSON="pass1.json"
          DL_DIR="dl"

          VERSION="$(date -u +%Y.%m.%d.%H%M)"
          LAST_MODIFIED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          printf '%s\n' 8.8.8.8 8.8.4.4 > "$RESOLVERS_FILE"
          mkdir -p "$DL_DIR"

          # Chuẩn hoá mọi định dạng (hosts, adblock, plain domain) về danh sách domain thuần
          normalize() {
            awk -v keep_exceptions="$1" '
              {
                line = tolower($0)
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", line)
                if (line == "" || line ~ /^[!#;\[]/) next
                if (line ~ /^@@/) { if (keep_exceptions != 1) next }
                sub(/^@@/, "", line)
                sub(/^\|\|?/, "", line)
                sub(/\^.*/, "", line);     sub(/[#!].*/, "", line)
                sub(/\/.*/, "", line);     sub(/:.*/, "", line)
                sub(/^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+[[:space:]]+/, "", line)
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", line)
                if (line ~ /^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+$/ && !seen[line]++) print line
              }'
          }

          # Ghi file kèm header.
          write_list() {
            local out="$1" title="$2" desc="$3" body="$4"
            if [[ -f "$out" ]] && diff -q <(grep -v -e '^!' -e '^\[Adblock' "$out") "$body" > /dev/null; then
              echo "$out: không thay đổi, giữ nguyên"
              return
            fi
            {
              echo "[Adblock Plus 2.0]"
              echo "! Title: $title"
              echo "! Version: $VERSION"
              echo "! Last modified: $LAST_MODIFIED"
              echo "! Expires: 12 hours (update frequency)"
              echo "! Description: $desc"
              echo "! GitHub: https://github.com/$GITHUB_REPOSITORY"
              echo "! Homepage: https://lists.bibica.net/$out"
              echo "!"
              cat "$body"
            } > "$out"
            echo "$out: đã cập nhật"
          }

          echo "Downloading..."
          curl -fsSL --max-time 90 --parallel --parallel-immediate \
            -o "$DL_DIR/block1.txt" https://adguardteam.github.io/HostlistsRegistry/assets/filter_16.txt \
            -o "$DL_DIR/block2.txt" https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt \
            -o "$DL_DIR/block3.txt" https://raw.githubusercontent.com/bibicadotnet/AdGuard-Home-blocklists/refs/heads/main/byme.txt \
            -o "$DL_DIR/block4.txt" https://badmojr.github.io/1Hosts/Lite/adblock.txt \
            -o "$DL_DIR/white1.txt" https://raw.githubusercontent.com/bibicadotnet/AdGuard-Home-blocklists/main/whitelist.txt \
            -o "$DL_DIR/white2.txt" https://raw.githubusercontent.com/ShadowWhisperer/BlockLists/master/Whitelists/Whitelist

          for f in "$DL_DIR"/*.txt; do
            [[ -s "$f" ]] || { echo "File rỗng hoặc tải lỗi: $f"; exit 1; }
          done

          # ---------------- WHITELIST GỐC ----------------
          cat "$DL_DIR"/white*.txt | normalize 1 | sort -u | sed 's/.*/@@||&^/' > "$WHITE_BODY"
          echo "Whitelist: $(wc -l < "$WHITE_BODY")"
          write_list "$WHITE_OUT" \
            "Whitelist Minimal (AdGuard format)" \
            "Whitelisted domains merged from multiple sources, converted to AdGuard syntax." \
            "$WHITE_BODY"

          # ---------------- BLOCKLIST GỐC ----------------
          cat "$DL_DIR"/block*.txt | normalize 0 | sort -u > "$BLOCK_TMP"
          TOTAL=$(wc -l < "$BLOCK_TMP")
          echo "Total: $TOTAL"

          echo "Pass 1..."
          massdns -r "$RESOLVERS_FILE" -t A -o J -s 800 --retry SERVFAIL "$BLOCK_TMP" 2>/dev/null > "$PASS1_JSON"

          jq -r 'select(.status == "NOERROR")  | .name | rtrimstr(".")' "$PASS1_JSON" > "$VALID_TMP"
          jq -r 'select(.status == "SERVFAIL") | .name | rtrimstr(".")' "$PASS1_JSON" > "$SERVFAIL_TMP"
          jq -r 'select(.status == "REFUSED")  | .name | rtrimstr(".")' "$PASS1_JSON" > "$REFUSED_TMP"

          SERVFAIL_COUNT=$(wc -l < "$SERVFAIL_TMP")
          REFUSED_COUNT=$(wc -l < "$REFUSED_TMP")
          echo "Pass 1 done – SERVFAIL còn: $SERVFAIL_COUNT | REFUSED: $REFUSED_COUNT"

          if [[ "$SERVFAIL_COUNT" -gt 0 ]]; then
            echo "Pass 2..."
            massdns -r "$RESOLVERS_FILE" -t A -o J -s 200 --retry SERVFAIL "$SERVFAIL_TMP" 2>/dev/null \
            | jq -r 'select(.status == "NOERROR") | .name | rtrimstr(".")' >> "$VALID_TMP"
          fi

          sort -u "$VALID_TMP" | sed 's/.*/||&^/' > "$BLOCK_BODY"
          echo "Valid: $(wc -l < "$BLOCK_BODY") / $TOTAL"
          write_list "$BLOCK_OUT" \
            "Blocklist Minimal (AdGuard format)" \
            "Resolvable domains merged from multiple blocklists, converted to AdGuard syntax." \
            "$BLOCK_BODY"

          rm -rf "$DL_DIR" "$BLOCK_TMP" "$BLOCK_BODY" "$WHITE_BODY" "$VALID_TMP" \
                 "$RESOLVERS_FILE" "$SERVFAIL_TMP" "$REFUSED_TMP" "$PASS1_JSON"
                 
          # ---------------- TẢI VÀ CHECK CÁC BỘ LỌC TỪ JSON ----------------
          EXTRA_JSON='[{"url":"https://lists.bibica.net/whitelist.txt"},{"label":"DNS Rewrites","url":"https://lists.bibica.net/rewrites.txt"},{"label":"HaGeZi Light","url":"https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/light.txt"},{"label":"HaGeZi Multi NORMAL","url":"https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/multi.txt"},{"label":"HaGeZi Pro","url":"https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/pro.txt"},{"label":"HaGeZi Pro++","url":"https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/pro.plus.txt"},{"label":"HaGeZi Ultimate","url":"https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/ultimate.txt"},{"label":"HaGeZi Threat Intelligence (Medium)","url":"https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/tif.medium.txt"},{"label":"HaGeZi NSFW","url":"https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/nsfw.txt"},{"label":"StevenBlack Unified Hosts","url":"https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts"},{"label":"OISD Big","url":"https://big.oisd.nl"},{"label":"OISD NSFW","url":"https://nsfw.oisd.nl"}]'

          echo "$EXTRA_JSON" | jq -c '.[]' | while read -r item; do
            url=$(echo "$item" | jq -r '.url')
            label=$(echo "$item" | jq -r '.label // empty')
            
            if [[ -n "$label" ]]; then
              filename=$(echo "$label" | tr '[:upper:]' '[:lower:]' | sed 's/++/-plus/g' | sed -E 's/[^a-z0-9]+/-/g' | sed 's/^-//;s/-$//').txt
            else
              filename=$(basename "$url")
              if [[ "$filename" != *.txt ]]; then
                filename="${filename}.txt"
              fi
              label="$filename"
            fi
            
            echo "--- Processing & Checking: $label ---"
            curl -fsSL --max-time 90 -o "ext_raw.tmp" "$url" || { echo "Tải lỗi: $url"; continue; }
            
            is_white=0
            if [[ "$label" =~ "whitelist" || "$label" =~ "Whitelist" ]]; then
               is_white=1
            fi
            
            cat "ext_raw.tmp" | normalize "$is_white" | sort -u > "ext_norm.tmp"
            TOTAL_EXT=$(wc -l < "ext_norm.tmp")
            echo "Total domains ($label): $TOTAL_EXT"
            
            # Pass 1 cho list thêm vào
            massdns -r "$RESOLVERS_FILE" -t A -o J -s 800 --retry SERVFAIL "ext_norm.tmp" 2>/dev/null > "ext_pass1.json"
            jq -r 'select(.status == "NOERROR") | .name | rtrimstr(".")' "ext_pass1.json" > "ext_valid.tmp"
            jq -r 'select(.status == "SERVFAIL") | .name | rtrimstr(".")' "ext_pass1.json" > "ext_servfail.tmp"
            
            SERVFAIL_EXT_COUNT=$(wc -l < "ext_servfail.tmp")
            
            # Pass 2 cho list thêm vào
            if [[ "$SERVFAIL_EXT_COUNT" -gt 0 ]]; then
              massdns -r "$RESOLVERS_FILE" -t A -o J -s 200 --retry SERVFAIL "ext_servfail.tmp" 2>/dev/null \
              | jq -r 'select(.status == "NOERROR") | .name | rtrimstr(".")' >> "ext_valid.tmp"
            fi
            
            if [[ "$is_white" == 1 ]]; then
               sort -u "ext_valid.tmp" | sed 's/.*/@@||&^/' > "ext_body.tmp"
            else
               sort -u "ext_valid.tmp" | sed 's/.*/||&^/' > "ext_body.tmp"
            fi
            
            VALID_EXT=$(wc -l < "ext_body.tmp")
            echo "Valid ($label): $VALID_EXT / $TOTAL_EXT"
            
            write_list "$filename" "$label" "Checked list from $url" "ext_body.tmp"
          done
          
          rm -f ext_raw.tmp ext_norm.tmp ext_pass1.json ext_valid.tmp ext_servfail.tmp ext_body.tmp

      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update filters"
          file_pattern: '*.txt'
