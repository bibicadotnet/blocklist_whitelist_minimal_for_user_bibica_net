name: Update AdGuard Filters

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adguard-filters-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build massdns
        run: |
          sudo apt-get install -y --no-install-recommends build-essential
          git clone --depth 1 https://github.com/blechschmidt/massdns /tmp/massdns
          make -C /tmp/massdns -j$(nproc)
          sudo mv /tmp/massdns/bin/massdns /usr/local/bin/massdns

      - name: Run
        run: |
          BLOCK_OUT="blocklists.txt"
          WHITE_OUT="whitelist.txt"
          BLOCK_TMP="blocklists.tmp"
          BLOCK_BODY="blocklists.body.tmp"
          WHITE_BODY="whitelist.body.tmp"
          VALID_TMP="valid.tmp"
          RESOLVERS_FILE="resolvers.tmp"
          SERVFAIL_TMP="servfail.tmp"
          REFUSED_TMP="refused.tmp"
          PASS1_JSON="pass1.json"
          DL_DIR="dl"

          VERSION="$(date -u +%Y.%m.%d.%H%M)"
          LAST_MODIFIED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          printf '%s\n' 8.8.8.8 8.8.4.4 > "$RESOLVERS_FILE"
          mkdir -p "$DL_DIR"

          # Chuẩn hoá mọi định dạng (hosts, adblock, plain domain) về danh sách domain thuần
          # $1 = 0: bỏ qua rule @@ (dùng cho blocklist)
          # $1 = 1: nhận cả rule @@ (dùng cho whitelist)
          normalize() {
            awk -v keep_exceptions="$1" '
              {
                line = tolower($0)
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", line)
                if (line == "" || line ~ /^[!#;\[]/) next
                if (line ~ /^@@/) { if (keep_exceptions != 1) next }
                sub(/^@@/, "", line)
                sub(/^\|\|?/, "", line)
                sub(/\^.*/, "", line);     sub(/[#!].*/, "", line)
                sub(/\/.*/, "", line);     sub(/:.*/, "", line)
                sub(/^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+[[:space:]]+/, "", line)
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", line)
                if (line ~ /^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+$/ && !seen[line]++) print line
              }'
          }

          # Ghi file kèm header.
          # Nếu phần rule không đổi so với file hiện có thì giữ nguyên
          # (Version/Last modified không đổi -> không sinh commit thừa)
          # $1 = file output, $2 = title, $3 = description, $4 = file chứa phần rule
          write_list() {
            local out="$1" title="$2" desc="$3" body="$4"
            if [[ -f "$out" ]] && diff -q <(grep -v -e '^!' -e '^\[Adblock' "$out") "$body" > /dev/null; then
              echo "$out: không thay đổi, giữ nguyên"
              return
            fi
            {
              echo "[Adblock Plus 2.0]"
              echo "! Title: $title"
              echo "! Version: $VERSION"
              echo "! Last modified: $LAST_MODIFIED"
              echo "! Expires: 12 hours (update frequency)"
              echo "! Description: $desc"
              echo "! GitHub: https://github.com/$GITHUB_REPOSITORY"
              echo "! Homepage: https://filters.bibica.net/$out"
              echo "!"
              cat "$body"
            } > "$out"
            echo "$out: đã cập nhật"
          }

          echo "Downloading..."
          curl -fsSL --max-time 90 --parallel --parallel-immediate \
            -o "$DL_DIR/block1.txt" https://adguardteam.github.io/HostlistsRegistry/assets/filter_16.txt \
            -o "$DL_DIR/block2.txt" https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt \
            -o "$DL_DIR/block3.txt" https://raw.githubusercontent.com/bibicadotnet/AdGuard-Home-blocklists/refs/heads/main/byme.txt \
            -o "$DL_DIR/block4.txt" https://badmojr.github.io/1Hosts/Lite/adblock.txt \
            -o "$DL_DIR/white1.txt" https://raw.githubusercontent.com/bibicadotnet/AdGuard-Home-blocklists/main/whitelist.txt \
            -o "$DL_DIR/white2.txt" https://raw.githubusercontent.com/ShadowWhisperer/BlockLists/master/Whitelists/Whitelist

          # Tránh commit nhầm danh sách rỗng nếu 1 nguồn bị lỗi
          for f in "$DL_DIR"/*.txt; do
            [[ -s "$f" ]] || { echo "File rỗng hoặc tải lỗi: $f"; exit 1; }
          done

          # ---------------- WHITELIST ----------------
          cat "$DL_DIR"/white*.txt | normalize 1 | sort -u | sed 's/.*/@@||&^/' > "$WHITE_BODY"
          echo "Whitelist: $(wc -l < "$WHITE_BODY")"
          write_list "$WHITE_OUT" \
            "Whitelist Minimal (AdGuard format)" \
            "Whitelisted domains merged from multiple sources, converted to AdGuard syntax." \
            "$WHITE_BODY"

          # ---------------- BLOCKLIST ----------------
          cat "$DL_DIR"/block*.txt | normalize 0 | sort -u > "$BLOCK_TMP"
          TOTAL=$(wc -l < "$BLOCK_TMP")
          echo "Total: $TOTAL"

          # Pass 1 – concurrency 800, tự retry SERVFAIL 1 lần
          echo "Pass 1..."
          massdns -r "$RESOLVERS_FILE" -t A -o J -s 800 --retry SERVFAIL "$BLOCK_TMP" 2>/dev/null > "$PASS1_JSON"

          jq -r 'select(.status == "NOERROR")  | .name | rtrimstr(".")' "$PASS1_JSON" > "$VALID_TMP"
          jq -r 'select(.status == "SERVFAIL") | .name | rtrimstr(".")' "$PASS1_JSON" > "$SERVFAIL_TMP"
          jq -r 'select(.status == "REFUSED")  | .name | rtrimstr(".")' "$PASS1_JSON" > "$REFUSED_TMP"

          SERVFAIL_COUNT=$(wc -l < "$SERVFAIL_TMP")
          REFUSED_COUNT=$(wc -l < "$REFUSED_TMP")
          echo "Pass 1 done – SERVFAIL còn: $SERVFAIL_COUNT | REFUSED: $REFUSED_COUNT"
          if [[ "$REFUSED_COUNT" -gt 0 ]]; then
            echo "--- REFUSED domains ---"
            cat "$REFUSED_TMP"
            echo "-----------------------"
          fi

          # Pass 2 – retry SERVFAIL với concurrency thấp hơn
          if [[ "$SERVFAIL_COUNT" -gt 0 ]]; then
            echo "Pass 2..."
            massdns -r "$RESOLVERS_FILE" -t A -o J -s 200 --retry SERVFAIL "$SERVFAIL_TMP" 2>/dev/null \
            | jq -r 'select(.status == "NOERROR") | .name | rtrimstr(".")' >> "$VALID_TMP"
          fi

          # Xuất ra định dạng AdGuard: ||domain^
          sort -u "$VALID_TMP" | sed 's/.*/||&^/' > "$BLOCK_BODY"
          echo "Valid: $(wc -l < "$BLOCK_BODY") / $TOTAL"
          write_list "$BLOCK_OUT" \
            "Blocklist Minimal (AdGuard format)" \
            "Resolvable domains merged from multiple blocklists, converted to AdGuard syntax." \
            "$BLOCK_BODY"

          rm -rf "$DL_DIR" "$BLOCK_TMP" "$BLOCK_BODY" "$WHITE_BODY" "$VALID_TMP" \
                 "$RESOLVERS_FILE" "$SERVFAIL_TMP" "$REFUSED_TMP" "$PASS1_JSON"

      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update filters"
          file_pattern: 'blocklists.txt whitelist.txt'
